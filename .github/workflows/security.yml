name: security

on:
  schedule:
    # Mondays at 07:23 UTC.
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  group: security
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dependencies:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Audit the locked dependencies of master and the latest release
        shell: bash
        run: |
          set -uo pipefail
          status=0
          tag="$(gh release view --json tagName --jq .tagName)"
          release="${RUNNER_TEMP}/release"
          git worktree add --detach "$release" "$tag"
          for checkout in "$GITHUB_WORKSPACE" "$release"; do
            name="master"
            [ "$checkout" = "$release" ] && name="$tag"
            if [ ! -f "$checkout/scripts/audit_dependencies.py" ]; then
              echo "### $name"$'\n\n'"Predates the dependency audit." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            report="$(cd "$checkout" && uv run --no-project --python 3.13 python scripts/audit_dependencies.py)"
            result=$?
            echo "$report"
            printf '### %s\n\n```\n%s\n```\n\n' "$name" "$report" >> "$GITHUB_STEP_SUMMARY"
            [ "$result" -ne 0 ] && status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "Fix on the dev machine with make audit-fix, run make check-local, and release a patch." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
