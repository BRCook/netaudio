name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Require an explicit release tag
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "Select a version tag when dispatching a release." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install --yes libasound2-dev libjack-jackd2-dev libpulse-dev pkg-config
      - run: uv lock --check
      - run: uv run --isolated --python 3.10 --no-project python -m compileall -q packages/netaudio/src/netaudio
      - run: uv run ruff check .
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match pyproject.toml version $version" >&2
            exit 1
          fi

  build-wheel:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x86_64
            manylinux-image: quay.io/pypa/manylinux_2_28_x86_64:latest
            artifact: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: aarch64
            manylinux-image: quay.io/pypa/manylinux_2_28_aarch64:latest
            artifact: linux-aarch64
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install --yes libasound2-dev libjack-jackd2-dev libpulse-dev pkg-config
      # Keep the container build's downloaded crates and compiled output between
      # releases; a new Cargo.lock starts a new cache but reuses the closest one.
      - uses: actions/cache@v4
        with:
          path: |
            target
            .cargo-home/registry
            .cargo-home/git
          key: manylinux-${{ matrix.architecture }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: manylinux-${{ matrix.architecture }}-
      - name: Build at the manylinux 2.28 compatibility floor
        shell: bash
        run: |
          docker run --pull always --rm \
            --volume "$PWD:/project" --workdir /project \
            "${{ matrix.manylinux-image }}" /bin/bash -euxo pipefail -c '
              export CARGO_HOME=/project/.cargo-home
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              export PATH="$CARGO_HOME/bin:/opt/python/cp39-cp39/bin:$PATH"
              python -m pip install --disable-pip-version-check uv auditwheel
              dnf install -y --setopt=skip_if_unavailable=True alsa-lib-devel jack-audio-connection-kit-devel pulseaudio-libs-devel pkgconf-pkg-config
              uv build --wheel
              wheel=(dist/*.whl)
              test "${#wheel[@]}" -eq 1
              original_wheel="${wheel[0]}"
              mkdir -p dist/unrepaired
              mv "$original_wheel" dist/unrepaired/
              auditwheel repair --plat "manylinux_2_28_$(uname -m)" \
                --exclude libasound.so.2 --exclude libpulse.so.0 \
                --wheel-dir dist "dist/unrepaired/${original_wheel##*/}"
              repaired_wheel=(dist/*.whl)
              test "${#repaired_wheel[@]}" -eq 1
              auditwheel show "${repaired_wheel[0]}"
            '
      - shell: bash
        run: |
          wheel=(dist/*.whl)
          if [ "${#wheel[@]}" -ne 1 ]; then
            echo "expected exactly one wheel in dist, found ${#wheel[@]}" >&2
            exit 1
          fi
          python scripts/verify_wheel_artifact.py "${wheel[0]}" \
            --platform "${{ matrix.platform }}" --architecture "${{ matrix.architecture }}"
          for python_version in 3.10 3.11 3.12 3.13 3.14; do
            uv run --isolated --no-project --python "$python_version" \
              python scripts/smoke_wheel_install.py "${wheel[0]}"
          done
      - shell: bash
        run: |
          wheel=(dist/*.whl)
          uv run --isolated --no-project --python 3.10 --with "${wheel[0]}" \
            python -c "from netaudio import core; core.require(); assert len(core.build_command({'command': 'reboot', 'host_mac': '001122334455'})) > 0"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.artifact }}
          path: dist/*.whl

  release:
    needs: build-wheel
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.whl
          generate_release_notes: true
